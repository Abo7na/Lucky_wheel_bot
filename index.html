<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - Lucky Strike</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        .wheel-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        canvas {
            background: #1e293b;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid #f43f5e;
            z-index: 10;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.4);
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #facc15;
        }
    </style>
</head>
<body>

    <h2>🎰 عجلة الحظ اليومية</h2>
    <p>أدر العجلة واربح نقاطاً رصيداً إضافياً!</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <div>
        <button id="spinBtn" onclick="spinWheel()">أدر العجلة الآن</button>
    </div>

    <div id="result"></div>

    <script>
        const telegram = window.Telegram.WebApp;
        telegram.expand(); // توسيع القناة لملء الشاشة

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        const sectors = [
            { label: "50 نقطة", color: "#f43f5e" },
            { label: "100 نقطة", color: "#3b82f6" },
            { label: "حظ أوفر", color: "#64748b" },
            { label: "200 نقطة", color: "#10b981" },
            { label: "10 نقاط", color: "#f59e0b" },
            { label: "500 نقطة", color: "#8b5cf6" }
        ];

        const arc = Math.PI / (sectors.length / 2);
        let startAngle = 0;
        let spinTimeout = null;
        let spinArcStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        function drawSector(sector, i) {
            const angle = startAngle + i * arc;
            ctx.save();
            ctx.beginPath();
            ctx.arc(150, 150, 140, angle, angle + arc, false);
            ctx.lineTo(150, 150);
            ctx.fillStyle = sector.color;
            ctx.fill();
            ctx.stroke();
            ctx.save();

            ctx.translate(150, 150);
            ctx.rotate(angle + arc / 2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 14px Tahoma";
            ctx.fillText(sector.label, 70, 10);
            ctx.restore();
            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, 300, 300);
            for (let i = 0; i < sectors.length; i++) {
                drawSector(sectors[i], i);
            }
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("result").innerText = "";

            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI) / 180;
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            const degrees = (startAngle * 180) / Math.PI + 90;
            const arcd = (arc * 180) / Math.PI;
            const index = Math.floor((360 - (degrees % 360)) / arcd);
            isSpinning = false;
            document.getElementById("spinBtn").disabled = false;
            
            const winningText = sectors[index].label;
            document.getElementById("result").innerText = `🎉 مبروك! ربحت: ${winningText}`;
            
            // اهتزاز خفيف لتأكيد الفوز داخل تيليجرام
            if (telegram.HapticFeedback) {
                telegram.HapticFeedback.notificationOccurred('success');
            }
        }

        function easeOut(t, b, c, d) {
            t /= d;
            t--;
            t++;
            return c * (t * t * t + 1) + b;
        }

        drawWheel();
    </script>
</body>
</html>
